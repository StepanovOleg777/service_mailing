{% extends 'base.html' %}

{% block title %}Удалить сообщение{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h2 class="mb-0">Удаление сообщения</h2>
            </div>
            <div class="card-body text-center">
                <p>Вы уверены, что хотите удалить сообщение "{{ object }}"?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Удалить</button>
                    <a href="{% url 'mailings:message_list' %}" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
